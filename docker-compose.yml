services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
    volumes:
      - app-data:/data
    depends_on:
      - redis

volumes:
  redis-data:
  app-data:
